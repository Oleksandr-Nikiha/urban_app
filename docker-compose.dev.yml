# Оточення для локальної розробки.
#     docker compose -f docker-compose.dev.yml up        # redis + api + bot
#     docker compose -f docker-compose.dev.yml --profile frontend up   # + Vite
#
# Postgres тут не піднімається — використовується зовнішній сервер із .env.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Контейнер працює від root, а ./api/src змонтовано з хоста — без цього
      # він засіває робочу копію root-овими __pycache__, які потім не стерти.
      PYTHONDONTWRITEBYTECODE: "1"
      # DATABASE_URL береться з .env (зовнішній сервер з postgres/pgadmin)
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000"   # 8000 на хості зайнятий portainer
    volumes:
      - ./api/src:/app/src   # hot-reload: правки коду одразу підхоплюються
      - ./uploads:/app/uploads
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"   # див. коментар у сервісі api
      PYTHONUNBUFFERED: "1"
    # DATABASE_URL береться з .env (зовнішній сервер з postgres/pgadmin)
    volumes:
      - ./bot/src:/app/src
    command: watchfiles --filter python "python -u -m src.main" src
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # НЕ env_file: .env — той віддав би контейнеру фронтенду ще й BOT_TOKEN
    # та DATABASE_URL. Vite вшиває у бандл лише VITE_*, але тримати секрети
    # в оточенні фронтенду немає причин. Перелічуємо явно тільки потрібне.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/urban-bites/api}
      VITE_DEV_INIT_DATA: ${VITE_DEV_INIT_DATA:-}
      VITE_PUBLIC_HOST: ${VITE_PUBLIC_HOST:-}
    ports:
      # Тільки локально: назовні Mini App віддає caddy зі зібраної статики
      # (scripts/deploy_frontend.sh). Dev-сервер публікувати не можна — він
      # віддає вихідні тексти з підставленими значеннями VITE_*-змінних.
      - "5173:5173"
    volumes:
      # node_modules навмисно НЕ ховаємо в анонімний том: інакше на хості його
      # немає, і VS Code не бачить типів — ні автодоповнення, ні помилок.
      # На Linux bind-mount нативний, тож втрат у швидкості немає.
      - ./frontend:/app
    # Залежності ставляться при старті, якщо їх ще немає на хості.
    command: sh -c "[ -d node_modules/vite ] || npm install; npm run dev -- --host 0.0.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  web-croissants:
    build:
      context: ./web-croissants
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/urban-bites/api}
      VITE_TELEGRAM_BOT_USERNAME: ${BOT_USERNAME:-urban_bites_tst_bot}
    ports:
      - "5174:5174"
    volumes:
      - ./web-croissants:/app
    command: sh -c "[ -d node_modules/vite ] || npm install; npm run dev -- --host 0.0.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  web-pizza:
    build:
      context: ./web-pizza
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/urban-bites/api}
      VITE_TELEGRAM_BOT_USERNAME: ${BOT_USERNAME:-urban_bites_tst_bot}
    ports:
      - "5175:5175"
    volumes:
      - ./web-pizza:/app
    command: sh -c "[ -d node_modules/vite ] || npm install; npm run dev -- --host 0.0.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  web-group:
    build:
      context: ./web-group
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/urban-bites/api}
      VITE_TELEGRAM_BOT_USERNAME: ${BOT_USERNAME:-urban_bites_tst_bot}
    ports:
      - "5176:5176"
    volumes:
      - ./web-group:/app
    command: sh -c "[ -d node_modules/vite ] || npm install; npm run dev -- --host 0.0.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  web-pos:
    build:
      context: ./web-pos
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/urban-bites/api}
    ports:
      - "5177:5177"
    volumes:
      - ./web-pos:/app
    command: sh -c "[ -d node_modules/vite ] || npm install; npm run dev -- --host 0.0.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
