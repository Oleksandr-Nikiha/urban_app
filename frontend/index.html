<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Urban Bites</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#12161A" />
    <meta name="color-scheme" content="dark" />

    <!-- Миттєве блокування миготіння та перебивання теми Telegram (Anti-flicker CSS) -->
    <style id="urban-brand-theme-root">
      :root {
        color-scheme: dark !important;
        --tg-theme-bg-color: #12161A !important;
        --tg-theme-secondary-bg-color: #1A1F26 !important;
        --tg-theme-text-color: #F4F5F7 !important;
        --tg-theme-hint-color: #94A3B8 !important;
        --tg-theme-link-color: #E05338 !important;
        --tg-theme-button-color: #D34528 !important;
        --tg-theme-button-text-color: #FFFFFF !important;
        --app-surface: #1A1F26 !important;
        --app-surface-2: #242B35 !important;
        --app-surface-3: #2E3744 !important;
        --app-border: #2E3744 !important;
        --app-border-focus: #E05338 !important;
        --app-veil: rgba(18, 22, 26, 0.88) !important;
      }
      html, body {
        background-color: #12161A !important;
        color: #F4F5F7 !important;
        color-scheme: dark !important;
      }
    </style>

    <!-- Шрифти Urban Bites Brand (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Офіційний скрипт Telegram: віддає window.Telegram.WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        function enforceTheme() {
          try {
            var el = document.documentElement;
            if (el && el.style) {
              el.style.setProperty("--tg-theme-bg-color", "#12161A", "important");
              el.style.setProperty("--tg-theme-secondary-bg-color", "#1A1F26", "important");
              el.style.setProperty("--tg-theme-text-color", "#F4F5F7", "important");
              el.style.setProperty("--tg-theme-hint-color", "#94A3B8", "important");
              el.style.setProperty("--tg-theme-link-color", "#E05338", "important");
              el.style.setProperty("--tg-theme-button-color", "#D34528", "important");
              el.style.setProperty("--tg-theme-button-text-color", "#FFFFFF", "important");
              el.style.setProperty("--app-surface", "#1A1F26", "important");
              el.style.setProperty("--app-surface-2", "#242B35", "important");
              el.style.setProperty("--app-surface-3", "#2E3744", "important");
              el.style.setProperty("--app-border", "#2E3744", "important");
              el.style.setProperty("--app-veil", "rgba(18, 22, 26, 0.88)", "important");
              el.style.colorScheme = "dark";
            }
            if (document.body && document.body.style) {
              document.body.style.backgroundColor = "#12161A";
              document.body.style.color = "#F4F5F7";
              document.body.style.colorScheme = "dark";
            }
          } catch(e) {}
        }

        function notifyTelegram() {
          enforceTheme();
          try {
            window.Telegram?.WebApp?.ready?.();
            window.Telegram?.WebApp?.expand?.();
            window.Telegram?.WebApp?.setHeaderColor?.("#12161A");
            window.Telegram?.WebApp?.setBackgroundColor?.("#12161A");
          } catch(e) {}
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(JSON.stringify({ eventType: "web_app_ready", eventData: "" }), "*");
              window.parent.postMessage(JSON.stringify({ eventType: "web_app_expand", eventData: "" }), "*");
              window.parent.postMessage(JSON.stringify({ eventType: "web_app_set_header_color", eventData: { color: "#12161A" } }), "*");
              window.parent.postMessage(JSON.stringify({ eventType: "web_app_set_background_color", eventData: { color: "#12161A" } }), "*");
            }
            if (window.TelegramWebviewProxy) {
              window.TelegramWebviewProxy.postEvent("web_app_ready", "");
              window.TelegramWebviewProxy.postEvent("web_app_expand", "");
              window.TelegramWebviewProxy.postEvent("web_app_set_header_color", JSON.stringify({ color: "#12161A" }));
              window.TelegramWebviewProxy.postEvent("web_app_set_background_color", JSON.stringify({ color: "#12161A" }));
            }
          } catch(e) {}
        }
        enforceTheme();
        notifyTelegram();
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", notifyTelegram);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
