<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF6F0; }
      .line-espresso { stroke: #3E2723; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-croissant { stroke: #C68B59; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-amber { stroke: #E69A38; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-espresso { fill: #3E2723; }
      .fill-croissant { fill: #C68B59; }
      .fill-amber { fill: #E69A38; }
      .text-title { font-family: 'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #3E2723; letter-spacing: 5px; text-anchor: middle; }
      .text-sub { font-family: 'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 34px; fill: #3E2723; letter-spacing: 7px; text-anchor: middle; }
      .text-amp { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: 28px; fill: #3E2723; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" class="bg" />

  <!-- Outer Ring Elements -->
  <circle cx="400" cy="400" r="350" stroke="#3E2723" stroke-width="10" fill="none" />
  <circle cx="400" cy="400" r="332" stroke="#C68B59" stroke-width="4" fill="none" />

  <!-- Central Horizontal Banner Separation -->
  <line x1="80" y1="365" x2="720" y2="365" class="line-espresso" stroke-width="10" />
  <line x1="80" y1="465" x2="720" y2="465" class="line-espresso" stroke-width="10" />

  <!-- Typography in Central Band -->
  <rect x="80" y="370" width="640" height="90" fill="#FAF6F0" />
  <text x="400" y="415" class="text-title">URBAN BAKERY</text>
  <text x="300" y="448" class="text-amp">&amp;</text>
  <text x="480" y="450" class="text-sub">COFFEE</text>

  <!-- TOP HALF: Sunrise, Skyline, Croissant & Coffee Cup -->
  <line x1="400" y1="60" x2="400" y2="365" class="line-espresso" stroke-width="8" />

  <!-- Left: Crescent Croissant & Coffee Bean -->
  <g transform="translate(240, 180) rotate(-25)">
    <path d="M -50 0 C -45 -40 45 -40 50 0 C 35 25 -35 25 -50 0 Z" class="fill-croissant" stroke="#3E2723" stroke-width="6" />
    <path d="M -25 -22 C -10 -5 10 -5 25 -22" class="line-espresso" stroke-width="5" />
    <path d="M -15 8 C -5 18 5 18 15 8" class="line-espresso" stroke-width="4" />
  </g>
  <g transform="translate(270, 275) rotate(35)">
    <ellipse cx="0" cy="0" rx="20" ry="28" class="fill-espresso" />
    <path d="M 0 -22 Q -8 0 0 22" stroke="#FAF6F0" stroke-width="4" fill="none" />
  </g>

  <path d="M 150 280 Q 165 200 200 150" class="line-amber" stroke-width="6" />
  <ellipse cx="170" cy="225" rx="14" ry="7" transform="rotate(-30 170 225)" class="fill-amber" />
  <ellipse cx="190" cy="185" rx="14" ry="7" transform="rotate(-45 190 185)" class="fill-amber" />
  <ellipse cx="150" cy="255" rx="14" ry="7" transform="rotate(-15 150 255)" class="fill-amber" />

  <!-- Center-Right: Skyline & Sunrise -->
  <circle cx="530" cy="210" r="50" class="line-amber" stroke-width="5" stroke-dasharray="10 10" />
  <path d="M 530 125 L 530 145 M 580 145 L 565 160 M 610 190 L 590 195 M 480 145 L 495 160 M 450 190 L 470 195" class="line-amber" stroke-width="5" />

  <path d="M 380 365 L 380 200 L 430 150 L 430 365" class="line-espresso" stroke-width="8" />
  <path d="M 430 220 L 480 180 L 480 365" class="line-croissant" stroke-width="8" />
  <path d="M 480 250 L 530 220 L 530 365" class="line-espresso" stroke-width="8" />

  <!-- Coffee Cup -->
  <g transform="translate(610, 290)">
    <path d="M -30 0 L 30 0 C 26 28 -26 28 -30 0 Z" class="fill-amber" stroke="#3E2723" stroke-width="6" />
    <path d="M 28 8 C 42 8 42 22 24 22" class="line-espresso" stroke-width="5" />
    <line x1="-38" y1="32" x2="38" y2="32" class="line-espresso" stroke-width="6" />
    <path d="M -10 -8 Q -15 -20 -8 -30" class="line-croissant" stroke-width="3" />
    <path d="M 10 -8 Q 5 -20 12 -30" class="line-croissant" stroke-width="3" />
  </g>

  <!-- BOTTOM HALF: Flour / Grains / Latte Art / Coffee Waves -->
  <g transform="translate(400, 560)">
    <path d="M 0 50 C -60 -10 -40 -60 0 -30 C 40 -60 60 -10 0 50 Z" class="fill-amber" stroke="#3E2723" stroke-width="6" />
    <path d="M -20 -10 Q 0 -35 20 -10" class="line-espresso" stroke-width="4" />
  </g>

  <g transform="translate(230, 580)">
    <path d="M -40 70 Q -10 0 30 -60" class="line-croissant" stroke-width="7" />
    <ellipse cx="-20" cy="30" rx="16" ry="8" transform="rotate(-40 -20 30)" class="fill-croissant" />
    <ellipse cx="0" cy="-5" rx="16" ry="8" transform="rotate(-40 0 -5)" class="fill-croissant" />
    <ellipse cx="15" cy="-35" rx="16" ry="8" transform="rotate(-40 15 -35)" class="fill-croissant" />
  </g>

  <path d="M 500 520 Q 560 500 620 530" class="line-espresso" stroke-width="6" />
  <path d="M 490 560 Q 570 540 640 570" class="line-croissant" stroke-width="6" />
  <path d="M 470 605 Q 555 585 630 620" class="line-espresso" stroke-width="6" />
  <path d="M 440 650 Q 535 630 605 665" class="line-croissant" stroke-width="6" />

  <path d="M 330 700 L 400 740 L 470 700" class="line-espresso" stroke-width="8" />
</svg>